name: Spec coverage audit

# Verifies every requirement in the SSO openspec contract is either
# covered by a `// @spec module#slug` tag in a test file OR explicitly
# listed in docs/spec-coverage-deferred.md.
#
# The contract is read from `vendor/openspec/specs/` — a checked-in
# snapshot of awais786/sso-rules-moneta refreshed via
# `scripts/refresh-openspec.sh`. CI needs no network/token access to
# the (private) upstream repo; drift is reconciled as a normal diff
# whenever the refresh script is run.
#
# Failure mode this catches: a new requirement lands upstream and the
# vendor is refreshed without a corresponding test tag or deferred-list
# entry — audit fails until the gap is closed.

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'docs/spec-coverage*.md'
      - 'scripts/check-spec-coverage.sh'
      - 'scripts/refresh-openspec.sh'
      - 'vendor/openspec/**'
      - '.github/workflows/spec-coverage.yml'
  push:
    branches: [main]
  schedule:
    # Daily 09:00 UTC — picks up upstream spec additions even when no PR
    # is open on this repo.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run coverage audit
        id: audit
        run: |
          set -o pipefail
          # Script defaults to the vendored copy at `vendor/openspec/specs/`
          # — no SPEC_DIR or SPEC_REPO_TOKEN required. The audit is
          # network-free at CI time. Drift from upstream is handled by
          # running `bash scripts/refresh-openspec.sh` locally and
          # committing the diff.
          if bash scripts/check-spec-coverage.sh | tee coverage-output.md; then
            echo "audit_exit=0" >> "$GITHUB_OUTPUT"
          else
            echo "audit_exit=$?" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to job summary
        if: always()
        run: cat coverage-output.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          always()
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: sso-spec-coverage
          path: coverage-output.md

      - name: Fail on missing coverage
        if: steps.audit.outputs.audit_exit != '0'
        run: |
          echo "::error::Spec contract has requirements not covered by a test tag or deferred entry. See the table above."
          exit 1
